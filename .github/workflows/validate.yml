name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare local configuration
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Compile Python sources
        run: python -m compileall -q app/src observability/grafana

      - name: Validate JSON files
        run: |
          python -m json.tool app/data/documents.json >/dev/null
          python -m json.tool observability/grafana/dashboards/genai-evaluations.json >/dev/null
